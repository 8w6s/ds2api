services:
  neutronapi:
    image: ghcr.io/8w6s/neutronapi:latest
    container_name: neutronapi
    restart: always
    env_file:
      - .env
    ports:
      # Host port is configurable via NEUTRON_HOST_PORT; container port stays fixed at 5001.
      - "${NEUTRON_HOST_PORT:-6011}:5001"
    volumes:
      - ./config.json:/data/config.json   # 配置文件（持久化推荐路径）
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - NEUTRON_ADMIN_KEY=${NEUTRON_ADMIN_KEY:-neutronapi}
      - NEUTRON_CONFIG_PATH=/data/config.json
